<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Atomic Era Motors Hub — Content Creators</title>
    <link rel="stylesheet" href="../pbg/index.html"> <!-- Uses style mirroring -->
</head>
<body>
    <div class="top-banners"><span>[Banner] Creator Focus: /aem/media/</span></div>
    <header>
        <button class="theme-toggle-btn" onclick="toggleTheme()">Toggle Dark Mode</button>
        <h1 id="welcome-title">Automic Era Motors Channel</h1>
        <a href="../index.html" class="nav-back-link">&larr; Return to Main Hub</a>
    </header>
    <div class="filter-controls">
        <select id="filter-select" onchange="applyLocalFilters()">
            <option value="Current">Videos: Current</option><option value="Last">Videos: Last</option><option value="Timeline">Videos: View Timeline</option>
        </select>
    </div>
    <main class="content-wrapper"><div class="creator-card" id="aem-card"></div></main>
    <div class="ai-chat-widget" id="ai-widget">
        <div class="ai-chat-header"><span>Automic Era Motors Chat</span><button class="ai-minimize-btn" onclick="minimizeAI()">Minimize</button></div>
        <div class="ai-chat-messages" id="ai-messages"></div>
        <div class="ai-chat-input-area"><input type="text" id="ai-input" placeholder="Ask AEM AI..."><button onclick="sendAiMessage()">Send</button></div>
    </div>
    <button class="ai-minimized-trigger" id="ai-minimized" onclick="restoreAI()">text</button>
    <script src="aem-script.js"></script>
</body>
</html>
